site_name: ag-core 文档
site_description: 企业级 Go 微服务框架 + 代码生成平台
site_author: aif-go

docs_dir: docs
site_dir: site

exclude_docs: |
  .obsidian/*
  .git/*

repo_url: https://github.com/aif-go/ag-core
repo_name: aif-go/ag-core

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.emoji
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - admonition

plugins:
  - search:
      lang: zh

